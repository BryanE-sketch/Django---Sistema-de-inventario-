<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema de Inventario{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'inventory:product_list' %}">📦 Inventario</a>
            {% if user.is_authenticated %}
            <div class="d-flex align-items-center gap-3">
                <a class="nav-link text-light" href="{% url 'inventory:product_list' %}">Productos</a>
                <a class="nav-link text-light" href="{% url 'inventory:category_list' %}">Categorías</a>
                <a class="nav-link text-light" href="{% url 'inventory:supplier_list' %}">Proveedores</a>
                <a class="nav-link text-light" href="{% url 'inventory:movement_list' %}">Movimientos</a>
                   <span class="text-secondary small">{{ user.username }}</span>
                   <form method="post" action="{% url 'logout' %}" class="m-0">
                       {% csrf_token %}
                   <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
                </form>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="container pb-5">
        {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}

        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
